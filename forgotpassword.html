<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên Mật Khẩu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .forgot-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 420px;
      padding: 35px 30px;
      text-align: center;
    }

    .logo-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      color: white;
      font-size: 20px;
    }

    h2 {
      color: #2d3748;
      margin-bottom: 8px;
      font-size: 24px;
      font-weight: 700;
    }

    .subtitle {
      color: #718096;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-label {
      display: block;
      margin-bottom: 8px;
      color: #4a5568;
      font-weight: 600;
      font-size: 13px;
    }

    .input-field {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.3s ease;
      background: #fafafa;
    }

    .input-field:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .success-message {
      color: #38a169;
      margin: 15px 0;
      padding: 12px;
      background: #f0fff4;
      border: 1px solid #9ae6b4;
      border-radius: 10px;
      display: none;
      font-size: 13px;
    }

    .error-message {
      color: #e53e3e;
      margin: 15px 0;
      padding: 12px;
      background: #fed7d7;
      border: 1px solid #feb2b2;
      border-radius: 10px;
      display: none;
      font-size: 13px;
    }

    .reset-section {
      display: none;
      margin-top: 10px;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .btn-secondary {
      background: #f7fafc;
      color: #4a5568;
      border: 2px solid #e2e8f0;
    }

    .btn-secondary:hover {
      background: #edf2f7;
    }

    .loading {
      display: none;
      margin: 20px 0;
      text-align: center;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .footer {
      margin-top: 20px;
      text-align: center;
    }

    .back-link {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-link:hover {
      color: #5a67d8;
    }
  </style>
</head>

<body>
  <div class="forgot-container">
    <div class="logo-icon">🔒</div>
    
    <h2>Quên Mật Khẩu</h2>
    <p class="subtitle">Nhập email để khôi phục mật khẩu</p>
    
    <div class="input-group">
      <label class="input-label" for="email">Email của bạn</label>
      <input type="email" id="email" class="input-field" placeholder="vidu@email.com" autocomplete="email">
    </div>
    
    <div class="success-message" id="successMessage"></div>
    <div class="error-message" id="errorMessage"></div>
    
    <div class="reset-section" id="resetSection">
      <div class="input-group">
        <label class="input-label" for="newPassword">Mật khẩu mới</label>
        <input type="password" id="newPassword" class="input-field" placeholder="Ít nhất 6 ký tự">
      </div>
      
      <div class="input-group">
        <label class="input-label" for="confirmPassword">Xác nhận mật khẩu</label>
        <input type="password" id="confirmPassword" class="input-field" placeholder="Nhập lại mật khẩu mới">
      </div>
    </div>
    
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p id="loadingText" style="font-size: 13px;">Đang xử lý...</p>
    </div>
    
    <div class="button-group">
      <button type="button" class="btn btn-primary" onclick="checkEmail()" id="actionBtn">
        Tiếp Theo
      </button>
      <button type="button" class="btn btn-secondary" onclick="goBack()">
        Quay Lại
      </button>
    </div>
    
    <div class="footer">
      <a href="login.html" class="back-link">
        <span>←</span> Quay lại trang đăng nhập
      </a>
    </div>
  </div>

  <script>
    let emailVerified = false;
    let userEmail = '';

    document.getElementById('email').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkEmail();
    });

    document.getElementById('newPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && emailVerified) resetPassword();
    });

    document.getElementById('confirmPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && emailVerified) resetPassword();
    });

    function showSuccess(message) {
        const successElement = document.getElementById('successMessage');
        successElement.textContent = message;
        successElement.style.display = 'block';
        hideError();
    }

    function showError(message) {
        const errorElement = document.getElementById('errorMessage');
        errorElement.textContent = message;
        errorElement.style.display = 'block';
        hideSuccess();
    }

    function hideSuccess() {
        document.getElementById('successMessage').style.display = 'none';
    }

    function hideError() {
        document.getElementById('errorMessage').style.display = 'none';
    }

    function showLoading(text = 'Đang xử lý...') {
        document.getElementById('loadingText').textContent = text;
        document.getElementById('loading').style.display = 'block';
    }

    function hideLoading() {
        document.getElementById('loading').style.display = 'none';
    }

    function checkEmail() {
        const email = document.getElementById("email").value.trim();

        if (!email) {
            showError("Vui lòng nhập email");
            return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            showError("Vui lòng nhập email hợp lệ");
            return;
        }

        hideError();
        showLoading('Đang kiểm tra email...');

        fetch("http://localhost:3000/auth/check-email", { 
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        })
        .then(response => {
            if (!response.ok) throw new Error('Lỗi kết nối server');
            return response.json();
        })
        .then(data => {
            hideLoading();
            
            if (data.exists) {
                emailVerified = true;
                userEmail = email;
                showSuccess("✅ Email tồn tại! Vui lòng tạo mật khẩu mới.");
                
                // Ẩn input email
                document.querySelector('.input-group').style.display = 'none';
                document.getElementById('resetSection').style.display = 'block';
                
                document.getElementById('actionBtn').textContent = 'Đặt Lại Mật Khẩu';
                document.getElementById('actionBtn').setAttribute('onclick', 'resetPassword()');
                document.getElementById('newPassword').focus();
            } else {
                showError("❌ Email không tồn tại");
            }
        })
        .catch(error => {
            hideLoading();
            console.error('Lỗi:', error);
            showError("⚠️ Không thể kết nối đến server");
        });
    }

    function resetPassword() {
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (!newPassword || !confirmPassword) {
            showError("Vui lòng nhập đầy đủ mật khẩu mới");
            return;
        }

        if (newPassword.length < 6) {
            showError("Mật khẩu phải có ít nhất 6 ký tự");
            return;
        }

        if (newPassword !== confirmPassword) {
            showError("Mật khẩu xác nhận không khớp");
            return;
        }

        hideError();
        showLoading('Đang đặt lại mật khẩu...');

        fetch("http://localhost:3000/auth/reset-password", { 
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ 
                email: userEmail, 
                newPassword: newPassword 
            })
        })
        .then(response => {
            if (!response.ok) throw new Error('Lỗi kết nối server');
            return response.json();
        })
        .then(data => {
            hideLoading();
            
            if (data.success) {
                showSuccess("🎉 Đặt lại mật khẩu thành công! Đang chuyển hướng...");
                document.getElementById('actionBtn').disabled = true;
                
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);
            } else {
                showError(data.message || "Có lỗi xảy ra");
            }
        })
        .catch(error => {
            hideLoading();
            console.error('Lỗi:', error);
            showError("⚠️ Có lỗi xảy ra, vui lòng thử lại");
        });
    }

    function goBack() {
        window.location.href = "login.html";
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById("email").focus();
    });
  </script>
</body>
</html>
