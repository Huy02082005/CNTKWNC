<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Admin</title>
  <link rel="stylesheet" href="/css/login.css">
</head>

<body>
  <div class="login-container">
    <h2>Đăng nhập Admin</h2>
    <div>
      <div class="input-group">
        <label for="username">Tài khoản</label>
        <input type="text" id="username" placeholder="Nhập tài khoản" autocomplete="username">
      </div>
      
      <div class="input-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password">
      </div>
      
      <div class="error-message" id="errorMessage"></div>
      
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Đang đăng nhập...</p>
      </div>
      
      <div class="button-group">
        <button type="button" class="login-btn" onclick="login()">Đăng nhập</button>
      </div>
    </div>
  </div>

  <script>
    function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        if (!username || !password) {
            showError("Vui lòng nhập đầy đủ thông tin");
            return;
        }

        showLoading();
        hideError();

        fetch("http://localhost:3000/api/auth/login", {  
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: 'include',
            body: JSON.stringify({ username, password })
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => { throw new Error(err.message || 'Login failed'); });
            }
            return response.json();
        })
        .then(data => {
            hideLoading();
            
            // SỬA: Kiểm tra success flag và data.user
            if (data.success && data.user) {
                console.log("👤 User data:", data.user);
                window.location.href = "dashboard.html";
            } else {
                showError(data.message || data.error || "Đăng nhập thất bại");
            }
        })
        .catch(error => {
            hideLoading();
            console.error('❌ Lỗi:', error);
            showError("Lỗi: " + error.message);
        });
    }

    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            login();
        }
    });

    function showError(message) {
        const errorElement = document.getElementById('errorMessage');
        errorElement.textContent = message;
        errorElement.style.display = 'block';
    }

    function hideError() {
        document.getElementById('errorMessage').style.display = 'none';
    }

    function showLoading() {
        document.getElementById('loading').style.display = 'block';
    }

    function hideLoading() {
        document.getElementById('loading').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById("username").focus();
        
        checkAuth();
    });
    
    // Hàm kiểm tra auth bằng cookies
    async function checkAuth() {
        try {
            const response = await fetch('/api/auth/check', {
                credentials: 'include'
            });
            
            const data = await response.json();
            
            if (data.authenticated && data.user) {
                window.location.href = "dashboard.html";
            }
        } catch (error) {
            console.log("Not logged in, stay on login page");
        }
    }
  </script>
</body>
</html>
